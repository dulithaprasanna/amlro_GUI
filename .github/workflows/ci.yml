name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: pip install -e ".[dev]"

      # backend/pyproject.toml deliberately points at AMLRO's main branch
      # unpinned (see docs/ARCHITECTURE.md), but main is temporarily ahead of
      # what this backend is built against until the mo_update branch merges
      # upstream. Reinstall from mo_update here so CI tests real
      # incompatibilities in this repo's own code, not upstream drift.
      - name: Reinstall AMLRO from the mo_update branch
        run: pip install --force-reinstall "git+https://github.com/RxnRover/amlro.git@mo_update"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-checks then builds)
        run: npm run build
